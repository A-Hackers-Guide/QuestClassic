[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/protocol",
    "crates/discovery",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["QuestClassic contributors"]
repository = "https://github.com/A-Hackers-Guide/QuestClassic"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
