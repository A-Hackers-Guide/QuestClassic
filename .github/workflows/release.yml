name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (vX.Y.Z)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Point self-updater at this repo
        run: |
          sed -i "s|REPLACE_WITH_OWNER|${{ github.repository_owner }}|g" \
            app/src/main/kotlin/io/github/questclassic/app/update/SelfUpdater.kt
          sed -i "s|\"QuestClassic\"|\"${{ github.event.repository.name }}\"|g" \
            app/src/main/kotlin/io/github/questclassic/app/update/SelfUpdater.kt

      - name: Decode signing keystore (optional)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.QUESTCLASSIC_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          echo "QUESTCLASSIC_KEYSTORE=$(pwd)/release.jks" >> $GITHUB_ENV

      - name: Build release APK
        env:
          QUESTCLASSIC_KEYSTORE_PASSWORD: ${{ secrets.QUESTCLASSIC_KEYSTORE_PASSWORD }}
          QUESTCLASSIC_KEY_ALIAS: ${{ secrets.QUESTCLASSIC_KEY_ALIAS }}
          QUESTCLASSIC_KEY_PASSWORD: ${{ secrets.QUESTCLASSIC_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QuestClassic ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
