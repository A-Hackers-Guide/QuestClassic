site_name: QuestClassic
site_description: Sideloadable Quest 2+ companion — nostalgic launcher, buzz-pattern diagnostics, programmable AI, build-your-own HUD, AR semicircle menu, self-update channel.
site_url: https://a-hackers-guide.github.io/QuestClassic/
repo_name: A-Hackers-Guide/QuestClassic
repo_url: https://github.com/A-Hackers-Guide/QuestClassic
copyright: Copyright © 2026 QuestClassic contributors · MIT

docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true

