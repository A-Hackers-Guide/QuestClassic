      - 0005 GitHub Releases: adr/0005-github-releases-as-update-channel.md
      - 0006 material-icons-extended: adr/0006-material-icons-extended.md
      - 0007 minSdk 29: adr/0007-min-sdk-29.md
  - Reverse engineering:
